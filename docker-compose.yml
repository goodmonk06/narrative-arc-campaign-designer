version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: narrative_arc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: narrativeuser
      POSTGRES_PASSWORD: narrativepass
      POSTGRES_DB: narrative_arc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrativeuser -d narrative_arc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - narrative_network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: narrative_arc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - narrative_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: narrative_arc_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://narrativeuser:narrativepass@postgres:5432/narrative_arc_db?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - narrative_network
    # Run migrations on startup
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  postgres_data:
  redis_data:

networks:
  narrative_network:
    driver: bridge
